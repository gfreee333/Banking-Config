#SQL
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5435/account_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USERNAME:dev}
spring.datasource.password=${POSTGRES_PASSWORD:dev123}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#Actuator
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
#Logging
logging.level.ru.bank.account_service=DEBUG
logging.level.org.springframework.cloud.config=DEBUG