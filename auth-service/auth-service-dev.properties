#SQL
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/auth_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USERNAME:dev}
spring.datasource.password=${POSTGRES_PASSWORD:dev123}
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#JWT
jwt.secret=dev-secret-key-for-testing-only
#Actuator
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=always
#Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis123}
#Logging
logging.level.com.bank.auth=DEBUG
logging.level.org.springframework.cloud.config=DEBUG